# yaml-language-server: $schema=../dashboard.schema.json
#
# Testlayout: värsta fallen inom gränserna (långa rubriker och enheter, 6-siffriga värden,
# 1/3/6 objekt per skärm). Används av backend-testerna och av demon med ?layout=stress
# (frontend/scripts/check-fit.mjs) – ingen skärm får flöda över.

opc:
  alarms: ns=3;i=1815
  screen:
    active: ns=3;s="DB Production TV"."screenHandler"."activeScreenNr"
    requested: ns=3;s="DB Production TV"."screenHandler"."requestScreenNr"

tags:
  ProductionCount: { node: ns=3;s="DB"."actual", demo: 999999 }
  TargetCount: { node: ns=3;s="DB"."target", demo: 999999 }
  ProductionState: { node: ns=3;s="DB"."prodState" }
  OEE: { node: ns=3;s="DB"."oee", demo: [60, 99.9] }
  TPM: ns=3;s="DB"."tpm"
  ShiftStart: { node: ns=3;s="DB"."shiftStart", type: time }
  ShiftEnd: { node: ns=3;s="DB"."shiftEnd", type: time }
  CurrentRuntime: { node: ns=3;s="DB"."runtime", type: time }
  Negative: { node: ns=3;s="DB"."neg", demo: -99999.9 }
  Scrap: { node: ns=3;s="DB"."scrap", demo: [0, 6] }
  Temp: { node: ns=3;s="DB"."temp", demo: [180, 999.9] }
  Mode: { node: ns=3;s="DB"."mode", demo: 3 }
  NotYet: ""

screens:
  1: { type: alarms }
  2:
    title: Sex objekt, långa texter
    items:
      - { label: Överhettningsskyddet, tag: ProductionCount, type: counter, unit: tjocka, target: TargetCount }
      - { label: MEDELTRYCK HYDRAULIK, tag: Negative, unit: mmmmmm, trend: true, decimals: 1 }
      - { label: OEE för hela skiftet, tag: OEE, type: percent, thresholds: [75, 85], trend: true, decimals: 1 }
      - { label: Kassation i procent, tag: Scrap, type: percent, thresholds: [2, 3], better: low, decimals: 1 }
      - { label: Linjeläge just nu, tag: Mode, type: status, states: { 1: { text: STOPP, color: red }, 2: { text: KÖR, color: green }, 3: { text: UNDERHÅLLS, color: amber } } }
      - { label: Aktuell körtid total, tag: CurrentRuntime, type: time }
  3:
    title: Ett objekt
    items:
      - { label: Godkända idag, tag: ProductionCount, type: counter, unit: st, target: 999999 }
  4:
    title: Tre objekt
    items:
      - { label: Ugnstemperatur zon 4, tag: Temp, unit: °C, thresholds: [200, 250], better: low, decimals: 1 }
      - { label: Ej kopplad tagg, tag: NotYet, unit: st }
      - { label: Takt, tag: TPM, unit: TPM, trend: true }
  5: { type: shift }
  6: { type: oee }
  7: { type: week }
  8: { type: highscore }
