name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Formatter unit tests
        run: npm test
      - run: npm run build
      - name: Build demo variant
        run: npm run build
        env:
          VITE_DEMO: "true"
          VITE_BASE: /asyncua-dashboard/
      - name: Fit check (no overflow/scroll on any screen at 5 TV resolutions)
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/asyncua-dashboard/ > /dev/null && break; sleep 1; done
          npm run check:fit
        env:
          # vite preview must use the same base as the demo build above
          VITE_DEMO: "true"
          VITE_BASE: /asyncua-dashboard/
          CHROME: /usr/bin/google-chrome
          BASE_URL: http://localhost:4173/asyncua-dashboard/
      - name: Editor e2e (Playwright in the installed Chrome, demo editor, no backend)
        run: npm run test:e2e
        env:
          CHROME: /usr/bin/google-chrome

  backend:
    name: Backend (ruff + pytest + import smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Ruff
        run: ruff check backend
      - name: Tests
        run: python -m pytest -q
      - name: Import smoke test (no PLC required)
        env:
          # Dummy values: settings are required at import time, but nothing connects on import.
          OPC_ENDPOINT_URL: opc.tcp://127.0.0.1:4840
          CLIENT_CERT: dummy-cert.pem
          CLIENT_KEY: dummy-key.pem
          DB_PATH: ci.db
        run: python -c "import backend.app.main as m; m.create_app(); print('backend import OK')"
