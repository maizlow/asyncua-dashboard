name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Build demo variant
        run: npm run build
        env:
          VITE_DEMO: "true"
          VITE_BASE: /asyncua-dashboard/

  backend:
    name: Backend (ruff + import smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ruff==0.17.1
      - name: Ruff
        run: ruff check backend
      - name: Import smoke test (no PLC required)
        env:
          # Dummy values: settings are required at import time, but nothing connects on import.
          OPC_ENDPOINT_URL: opc.tcp://127.0.0.1:4840
          CLIENT_CERT: dummy-cert.pem
          CLIENT_KEY: dummy-key.pem
          DB_PATH: ci.db
        run: python -c "import backend.app.main as m; m.create_app(); print('backend import OK')"
